name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
      - run: bun install
      - run: bun test
  no-paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
        echo "Checking for paper/simulated trading references..."
        if grep -RInE 'paper|simulated trading|simulaci.n|synthetic feed' \
          --exclude-dir=node_modules --exclude-dir=.git --exclude='*.lock' \
          --exclude='skills-lock.json' --exclude='reports/' \
          --exclude='CONTEXT.md' --exclude='.env' \
          . ; then
          echo "ERROR: paper/simulated trading references found above."; exit 1;
        fi
        echo "OK: no paper/simulated trading references."
